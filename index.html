<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UG Hub - Key System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Kanit', sans-serif;
            background: linear-gradient(135deg, #070a13 0%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #f8fafc;
        }
        .container {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            max-width: 450px;
            width: 90%;
            text-align: center;
        }
        h2 { font-size: 26px; font-weight: 600; margin: 0 0 10px 0; color: #3b82f6; text-shadow: 0 0 10px rgba(59,130,246,0.3); }
        .version { font-size: 12px; background: rgba(59,130,246,0.2); color: #60a5fa; padding: 2px 8px; border-radius: 20px; display: inline-block; margin-bottom: 20px; }
        #instruction { font-size: 14px; color: #94a3b8; line-height: 1.6; margin-bottom: 25px; font-weight: 300; }
        #action-btn {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white; border: none; padding: 15px 30px; font-size: 16px; font-weight: 500;
            border-radius: 12px; cursor: pointer; width: 100%; transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4); font-family: 'Kanit', sans-serif;
        }
        #action-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6); }
        #status-area { display: none; margin-top: 10px; }
        .spinner {
            width: 35px; height: 35px; border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #3b82f6;
            border-radius: 50%; margin: 0 auto 15px auto; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #status-text { font-size: 16px; color: #38bdf8; }
        #key-box {
            display: none; margin-top: 15px; padding: 15px; background: rgba(16, 185, 129, 0.08);
            border: 1px solid #10b981; border-radius: 12px; box-shadow: 0 0 15px rgba(16, 185, 129, 0.1);
        }
        #key-text { font-family: monospace; font-size: 18px; font-weight: bold; color: #34d399; word-break: break-all; margin-bottom: 15px; display: block; }
        #copy-btn {
            background: #10b981; color: white; border: none; padding: 8px 20px; font-size: 14px;
            border-radius: 6px; cursor: pointer; transition: background 0.2s; font-family: 'Kanit', sans-serif;
        }
        #copy-btn:hover { background: #059669; }
    </style>
</head>
<body>

    <div class="container">
        <h2>UG Hub Key System</h2>
        <div class="version">v8.2 Official Authentication</div>
        <p id="instruction">กรุณาคลิกปุ่มสีฟ้าด้านล่างเพื่อเข้าสู่หน้าลิงก์โฆษณาจำลอง และหน้าเดิมนี้จะเริ่มทำการตรวจสอบระบบเพื่อออกคีย์ให้คุณ</p>
        
        <button id="action-btn">รับคีย์เข้าใช้งานสคริปต์</button>
        
        <div id="status-area">
            <div class="spinner"></div>
            <div id="status-text">กำลังตรวจสอบระบบ... (5 วินาที)</div>
        </div>
        
        <div id="key-box">
            <span style="color: #94a3b8; font-size: 13px; display:block; margin-bottom:5px;">คีย์ของคุณคือ (มีอายุใช้งานเฉพาะวันนี้เท่านั้น):</span>
            <span id="key-text">---------</span>
            <button id="copy-btn" onclick="copyKey()">คัดลอกคีย์</button>
        </div>
    </div>

    <script>
        // 🔗 ใส่ลิงก์เว็บจำลองของน้องตรงนี้ (เช่น ลิงก์ช่องดิสคอร์ด หรือเว็บโฆษณา)
        const targetURL = "https://discord.gg/v6Qh69hqd"; 

        const actionBtn = document.getElementById("action-btn");
        const statusArea = document.getElementById("status-area");
        const statusText = document.getElementById("status-text");
        const keyBox = document.getElementById("key-box");
        const keyText = document.getElementById("key-text");
        const instruction = document.getElementById("instruction");

        // ฟังก์ชันคำนวณคีย์ประจำเป็นวัน (เพื่อให้สอดคล้องกับตัวเกม)
        function getDailyKey() {
            const date = new Date();
            // สร้างเลขคีย์จาก วัน-เดือน-ปี เพื่อให้คีย์จะเปลี่ยนไปในทุกๆ วัน
            const seed = date.getDate().toString() + (date.getMonth() + 1).toString() + date.getFullYear().toString();
            let hash = 0;
            for (let i = 0; i < seed.length; i++) {
                hash = seed.charCodeAt(i) + ((hash << 5) - hash);
            }
            const keyResult = "UG-" + Math.abs(hash).toString(16).toUpperCase() + "X" + (date.getDate() * 7);
            return keyResult;
        }

        actionBtn.addEventListener("click", function() {
            window.open(targetURL, "_blank"); // เปิดแท็บใหม่ไปยังเว็บเป้าหมาย

            actionBtn.style.display = "none";
            instruction.style.display = "none";
            statusArea.style.display = "block";

            let timeLeft = 5;
            const countdown = setInterval(function() {
                timeLeft -= 1;
                if (timeLeft > 0) {
                    statusText.innerText = `กำลังตรวจสอบระบบ... (${timeLeft} วินาที)`;
                } else {
                    clearInterval(countdown);
                    statusArea.style.display = "none";
                    keyText.innerText = getDailyKey(); // แสดงคีย์จริง
                    keyBox.style.display = "block";
                }
            }, 1000);
        });

        function copyKey() {
            navigator.clipboard.writeText(keyText.innerText);
            const btn = document.getElementById("copy-btn");
            btn.innerText = "✓ คัดลอกสำเร็จ!";
            btn.style.background = "#2563eb";
            setTimeout(() => {
                btn.innerText = "คัดลอกคีย์";
                btn.style.background = "#10b981";
            }, 2000);
        }
    </script>
</body>
</html>
